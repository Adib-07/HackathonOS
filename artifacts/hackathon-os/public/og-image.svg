<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11151a"/>
      <stop offset="100%" style="stop-color:#151a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#49c998"/>
      <stop offset="100%" style="stop-color:#6bd8ae"/>
    </linear-gradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  
  <!-- Brand mark -->
  <rect x="100" y="100" width="120" height="120" rx="24" fill="url(#accent)"/>
  <text x="160" y="185" font-family="DM Mono, monospace" font-size="56" font-weight="500" fill="#0e211a" text-anchor="middle" dominant-baseline="middle">H</text>
  
  <!-- Title -->
  <text x="250" y="150" font-family="Manrope, sans-serif" font-size="48" font-weight="800" fill="#e1e7e5" letter-spacing="-2px">hackathon</text>
  <text x="250" y="210" font-family="Manrope, sans-serif" font-size="48" font-weight="800" fill="url(#accent)" letter-spacing="-2px">os</text>
  
  <!-- Tagline -->
  <text x="250" y="280" font-family="Manrope, sans-serif" font-size="20" fill="#9aa59f">Your Hackathon Command Center</text>
  
  <!-- Features -->
  <g font-family="Manrope, sans-serif" font-size="16" fill="#7f8b85">
    <text x="100" y="380">✓ Deadline-aware planning</text>
    <text x="100" y="420">✓ Evidence-based verification</text>
    <text x="100" y="460">✓ Competition workspace management</text>
    <text x="600" y="380">✓ Team collaboration</text>
    <text x="600" y="420">✓ GitHub integration</text>
    <text x="600" y="460">✓ Win-focused guidance</text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="560" font-family="Manrope, sans-serif" font-size="14" fill="#55625b" text-anchor="middle">hackathonos.dev · Private by design</text>
</svg>