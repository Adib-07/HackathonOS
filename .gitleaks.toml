# Gitleaks configuration for HackathonOS
# Extends default rules and adds allowlist for test/fake keys

[extend]
useDefault = true

[allowlist]
description = "Allowlisted gitleaks patterns - each entry is narrow with justification"
# Allow test keys that are clearly marked as test/fake - exact prefixes used in CI
regexes = [
  # Clerk test keys (sk_test_*, pk_test_) - used in CI workflow only
  '''sk_test_[a-zA-Z0-9]{24,}''',
  '''pk_test_[a-zA-Z0-9]{24,}''',
  # Historical test fixtures in git history - test files only
  '''sk_live_fake[-_]?test[-_]?key[-_]?do[-_]?not[-_]?use''',
  '''API_KEY=['"][a-zA-Z0-9]{10,}['"]''',
  # Generic test/fake keys - only when explicitly prefixed
  '''test[-_]?key[a-zA-Z0-9]*''',
  '''fake[-_]?key[a-zA-Z0-9]*''',
  '''dummy[-_]?key[a-zA-Z0-9]*''',
  '''example[-_]?key[a-zA-Z0-9]*''',
  '''placeholder[-_]?key[a-zA-Z0-9]*''',
]

# Allow specific files that may contain patterns that look like secrets
# Each path is a single file or exact pattern, not folder-wide
paths = [
  # Lockfiles may contain integrity hashes that resemble secrets
  '''package-lock\.json$''',
  '''pnpm-lock\.yaml$''',
  # Test results directory - contains error outputs with fake keys
  '''test-results/[^/]+\.md$''',
  # This config file itself references patterns
  '''\.gitleaks\.toml$''',
  # Security review doc contains example patterns for documentation
  '''docs/security-review\.md$''',
  # Vercel output directory - may contain deployment metadata
  '''\.vercel/output/.*$''',
  # Test files with historical fake secrets in git history
  '''artifacts/api-server/test/evidence-api\.test\.mjs$''',
]