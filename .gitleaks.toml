# Gitleaks configuration for HackathonOS
# Extends default rules and adds allowlist for test/fake keys

[allowlist]
description = "Allowlisted gitleaks patterns"
# Allow test keys that are clearly marked as test/fake
regexes = [
  '''test[-_]?key''',
  '''fake[-_]?key''',
  '''dummy[-_]?key''',
  '''example[-_]?key''',
  '''placeholder[-_]?key''',
  '''sk_test_''',
  '''pk_test_''',
]

# Allow specific files that may contain patterns that look like secrets
paths = [
  '''package-lock\.json''',
  '''pnpm-lock\.yaml''',
  '''test-results/.*''',
  '''\.gitleaks\.toml''',
  '''docs/security-review\.md''',
]

# Use default rules from gitleaks
[rule]
# This extends the default gitleaks rules - gitleaks will use its built-in rules
# and apply our allowlist on top
id = "default-rules"
description = "Use gitleaks default detection rules"
useDefault = true