name: CI

on:
  push:
    branches: [main, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      # Test database - isolated from production
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      # Clerk test keys (not production)
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_CLERK_PUBLISHABLE_KEY }}
      # AI provider not configured in CI - tests handle this gracefully
      OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY }}
      # CORS allow-list for testing
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Body size limit for testing
      BODY_SIZE_LIMIT: 1mb
      # Rate limiting disabled in test mode (see rateLimit.ts)
      LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (prettier check)
        run: pnpm exec prettier --check .

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Security audit (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: '--verbose --redact'

  # Optional: Run security audit separately for visibility
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: '--verbose --redact'

      - name: Run pnpm audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod