name: CI

on:
  push:
    branches: [main, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hackathon_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d hackathon_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      # Test database - isolated from production, uses service container
      DATABASE_URL: postgresql://test:test@localhost:5432/hackathon_os_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/hackathon_os_test
      # CI guard - tests must refuse to run if this is not set
      CI: "true"
      # Clerk test keys (not production)
      CLERK_SECRET_KEY: sk_test_fake_ci_only_key_do_not_use
      CLERK_PUBLISHABLE_KEY: pk_test_fake_ci_only_key_do_not_use
      # AI provider not configured in CI - tests handle this gracefully
      OPENAI_API_KEY: sk-fake-ci-only-key-do-not-use
      # CORS allow-list for testing
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Body size limit for testing
      BODY_SIZE_LIMIT: 1mb
      # Rate limiting disabled in test mode (see rateLimit.ts)
      LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @workspace/db run migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (prettier check)
        run: pnpm exec prettier --check .

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Security audit (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Run security audit separately for visibility
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --prod