openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Authenticated HackathonOS competition planning API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: competitions
    description: Competition workspaces and plans
  - name: intel
    description: Problem analysis, research, opportunities, ideas, and build briefs
security:
  - clerkSession: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [competitions]
      summary: Get the workspace overview
      responses:
        "200":
          description: Overview of the owner's competitions and next action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List the owner's competitions
      responses:
        "200":
          description: Competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Create a competition workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Created competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /competitions/{competitionId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get a competition workspace
      responses:
        "200":
          description: Competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCompetition
      tags: [competitions]
      summary: Update competition details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionUpdate"
      responses:
        "200":
          description: Updated competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/plans:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listPlanVersions
      tags: [competitions]
      summary: List saved plan versions
      responses:
        "200":
          description: Plan versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowPlanSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: generatePlan
      tags: [competitions]
      summary: Generate a deadline-aware plan and save a new version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Generated plan version and its tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/plans/{planId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPlan
      tags: [competitions]
      summary: Get a saved plan version and its tasks
      responses:
        "200":
          description: Plan version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/tasks/{taskId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTask
      tags: [competitions]
      summary: Update a task's status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/evidence:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listEvidence
      tags: [competitions]
      summary: List verification evidence recorded for a competition
      responses:
        "200":
          description: Evidence records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/tasks/{taskId}/evidence:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createEvidence
      tags: [competitions]
      summary: Record a verification evidence entry for a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Recorded evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/evidence/{evidenceId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteEvidence
      tags: [competitions]
      summary: Remove a verification evidence entry
      responses:
        "200":
          description: Removal confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/analysis:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAnalysis
      tags: [intel]
      summary: Get the latest problem analysis for a competition
      responses:
        "200":
          description: The latest analysis and its requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAnalysis
      tags: [intel]
      summary: Analyse the stored competition record into reviewable requirements
      responses:
        "201":
          description: The analysis and its requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/analysis/requirements/{requirementId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requirementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRequirement
      tags: [intel]
      summary: Edit or review an extracted requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdate"
      responses:
        "200":
          description: The updated requirement
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirement:
                    $ref: "#/components/schemas/AnalysisRequirement"
                required: [requirement]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/research:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listResearch
      tags: [intel]
      summary: List the research findings recorded for a competition
      responses:
        "200":
          description: Research findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResearchFinding"
                required: [findings]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createResearch
      tags: [intel]
      summary: Search real research sources, or record a finding by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRequest"
      responses:
        "201":
          description: The findings that were recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many research searches in a short time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /competitions/{competitionId}/research/{findingId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: findingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteResearch
      tags: [intel]
      summary: Remove a research finding
      responses:
        "200":
          description: Removal confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/gaps:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listGaps
      tags: [intel]
      summary: List the opportunities identified for a competition
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  gaps:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResearchGap"
                required: [gaps]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createGaps
      tags: [intel]
      summary: Identify opportunities from the analysis and the research findings
      responses:
        "201":
          description: The opportunities that were identified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/ideas:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listIdeas
      tags: [intel]
      summary: List the idea candidates and compare them
      responses:
        "200":
          description: Idea candidates with their evaluations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeasResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createIdeas
      tags: [intel]
      summary: Generate buildable idea candidates for the competition
      responses:
        "201":
          description: The idea candidates that were generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ideas:
                    type: array
                    items:
                      $ref: "#/components/schemas/IdeaCandidate"
                  provider:
                    type: ["string", "null"]
                  model:
                    type: ["string", "null"]
                required: [ideas]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /competitions/{competitionId}/ideas/{ideaId}/evaluate:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ideaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: evaluateIdea
      tags: [intel]
      summary: Score an idea on the rubric and compute its weighted total
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
      responses:
        "200":
          description: The evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: "#/components/schemas/IdeaEvaluation"
                required: [evaluation]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/rubric:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: saveRubric
      tags: [intel]
      summary: Save the weights used to score ideas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubricRequest"
      responses:
        "200":
          description: The normalised weights
          content:
            application/json:
              schema:
                type: object
                properties:
                  weights:
                    type: object
                    additionalProperties:
                      type: number
                required: [weights]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/ideas/{ideaId}/decision:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ideaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideIdea
      tags: [intel]
      summary: Record the team's decision about an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaDecisionRequest"
      responses:
        "200":
          description: The updated idea
          content:
            application/json:
              schema:
                type: object
                properties:
                  idea:
                    $ref: "#/components/schemas/IdeaCandidate"
                required: [idea]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/ideas/{ideaId}/brief:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ideaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createBrief
      tags: [intel]
      summary: Produce a build brief for the selected idea
      responses:
        "201":
          description: The build brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    $ref: "#/components/schemas/BuildBriefRecord"
                  missingSections:
                    type: array
                    items:
                      type: string
                  method:
                    type: string
                required: [brief]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /competitions/{competitionId}/briefs:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listBriefs
      tags: [intel]
      summary: List the build briefs saved for a competition
      responses:
        "200":
          description: Build briefs
          content:
            application/json:
              schema:
                type: object
                properties:
                  briefs:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuildBriefRecord"
                required: [briefs]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  responses:
    Unauthorized:
      description: A valid authenticated session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request did not pass validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: ["string", "null"]
          description: A machine-readable reason, when the error has one.
        missing:
          type: array
          items:
            type: string
          description: Configuration that is missing, when the error is a configuration error.
      required: [error]
    CompetitionInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        organizer:
          type: ["string", "null"]
          maxLength: 160
        competitionType:
          type: string
          enum: [online, in_person, hybrid, unknown]
        startAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: string
          format: date-time
        teamSize:
          type: integer
          minimum: 1
          maximum: 100
        trackMode:
          type: string
          enum: [assigned, choose]
        currentTrack:
          type: ["string", "null"]
          maxLength: 200
        problemStatement:
          type: ["string", "null"]
          maxLength: 20000
        officialUrl:
          type: ["string", "null"]
          format: uri
        rulesUrl:
          type: ["string", "null"]
          format: uri
        mandatoryDeliverables:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          maxItems: 50
        teamSkills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 30
        ideaComplexity:
          type: integer
          minimum: 1
          maximum: 5
        status:
          type: string
          enum: [preparing, active, submitted, completed]
      required: [name, deadline]
    CompetitionUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        organizer:
          type: ["string", "null"]
          maxLength: 160
        competitionType:
          type: string
          enum: [online, in_person, hybrid, unknown]
        startAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: string
          format: date-time
        teamSize:
          type: integer
          minimum: 1
          maximum: 100
        trackMode:
          type: string
          enum: [assigned, choose]
        currentTrack:
          type: ["string", "null"]
          maxLength: 200
        problemStatement:
          type: ["string", "null"]
          maxLength: 20000
        officialUrl:
          type: ["string", "null"]
          format: uri
        rulesUrl:
          type: ["string", "null"]
          format: uri
        mandatoryDeliverables:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          maxItems: 50
        teamSkills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 30
        ideaComplexity:
          type: integer
          minimum: 1
          maximum: 5
        status:
          type: string
          enum: [preparing, active, submitted, completed]
      minProperties: 1
    Competition:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organizer:
          type: ["string", "null"]
        competitionType:
          type: string
          enum: [online, in_person, hybrid, unknown]
        startAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: string
          format: date-time
        teamSize:
          type: integer
        trackMode:
          type: string
          enum: [assigned, choose]
        currentTrack:
          type: ["string", "null"]
        problemStatement:
          type: ["string", "null"]
        officialUrl:
          type: ["string", "null"]
        rulesUrl:
          type: ["string", "null"]
        mandatoryDeliverables:
          type: array
          items:
            type: string
        teamSkills:
          type: array
          items:
            type: string
        ideaComplexity:
          type: integer
        status:
          type: string
          enum: [preparing, active, submitted, completed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - organizer
        - competitionType
        - startAt
        - deadline
        - teamSize
        - trackMode
        - currentTrack
        - problemStatement
        - officialUrl
        - rulesUrl
        - mandatoryDeliverables
        - teamSkills
        - ideaComplexity
        - status
        - createdAt
        - updatedAt
    EvidenceInput:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            [TEST_RESULT, BUILD_RESULT, DEPLOYMENT_URL, HTTP_CHECK, MANUAL_REVIEW, SUBMISSION_CONFIRMATION]
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        result:
          type: string
          enum: [passed, failed]
        sourceUrl:
          type: ["string", "null"]
          maxLength: 2000
        commandName:
          type: ["string", "null"]
          maxLength: 300
        observedAt:
